<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق قراءة - كتاب التأسيس</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&family=Acme&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1.6">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1>كتاب التأسيس التفاعلي</h1>
            <div class="mode-controls">
                <div class="teacher-controls teacher-only desktop-only" style="display: flex; gap: 10px; align-items: center; margin-left: 15px;">
                    <button id="deletePageBtn" class="delete-btn" title="حذف الصفحة الحالية" style="margin-left: 5px;"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg></button>
                    <button id="layoutVerticalBtn" class="premium-btn">توزيع عمودي</button>
                    <button id="layoutCentralBtn" class="premium-btn">توزيع مركزي</button>
                </div>
                <div class="mode-switcher">
                    <span class="mode-label">وضع المعلم</span>
                    <label class="switch">
                        <input type="checkbox" id="modeToggle">
                        <span class="slider round"></span>
                    </label>
                    <span class="mode-label">وضع الطالب</span>
                </div>
            </div>
        </div>
    </header>

    <main class="content">
        <div class="container reading-stack">
            <div id="wordsGrid" class="words-grid">
                <!-- Cards will be generated here by script.js -->
            </div>
            <div class="pagination-bar" aria-label="تصفح الصفحات">
                <div class="pagination-inner">
                    <button id="addPageBtn" class="add-btn teacher-only" title="إضافة صفحة جديدة">+</button>
                    <button id="prevPage" class="pag-btn" title="الصفحة السابقة">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <div class="page-info" dir="ltr" lang="en">
                        <span class="page-info-label">Page</span>
                        <input type="text" id="pageInput" lang="en" inputmode="numeric" min="1" value="1">
                        <span class="page-info-label">of <span id="totalPages">1</span></span>
                    </div>
                    <button id="nextPage" class="pag-btn" title="الصفحة التالية">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>
            </div>
        </div>
    </main>


    <script src="firebase-config.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
