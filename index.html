<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق قراءة - كتاب التأسيس</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&family=Acme&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1.2">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1>كتاب التأسيس التفاعلي</h1>
            <div class="mode-controls">
                <div class="mode-switcher">
                    <span class="mode-label">وضع المعلم</span>
                    <label class="switch">
                        <input type="checkbox" id="modeToggle">
                        <span class="slider round"></span>
                    </label>
                    <span class="mode-label">وضع الطالب</span>
                </div>
            </div>
        </div>
    </header>

    <main class="content">
        <div class="container">
            <div id="wordsGrid" class="words-grid">
                <!-- Cards will be generated here by script.js -->
            </div>
        </div>
    </main>

    <div class="pagination-bar">
        <div class="container">
            <button id="addPageBtn" class="add-btn teacher-only" title="إضافة صفحة جديدة">+</button>
            <button id="prevPage" class="pag-btn">▶</button>
            <div class="page-info">
                <span>صفحة</span>
                <input type="number" id="pageInput" min="1" value="1">
                <span>من <span id="totalPages">1</span></span>
            </div>
            <button id="nextPage" class="pag-btn">◀</button>
        </div>
    </div>

    <footer class="main-footer">
        <p>جميع الحقوق محفوظة &copy; 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
